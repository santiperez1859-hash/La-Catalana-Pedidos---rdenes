<!DOCTYPE html>
<html lang="es-UY">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos Web - La Catalana v9</title>
  <style>
    :root {
      --lc-red: #5B2725;
      --lc-yellow: #F0C72F;
      --bg: #e9e9e9;
      --panel: #ffffff;
      --line: #111111;
      --soft-line: #d6d6d6;
      --muted: #606060;
      --focus: rgba(240, 199, 47, .35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
    }

    button, input {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 10px;
      background: #f4f4f4;
      border-bottom: 1px solid #c9c9c9;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
    }

    .brand img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      background: #fff;
    }

    .brand-title {
      line-height: 1.05;
    }

    .brand-title strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
    }

    .brand-title span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid #bdbdbd;
      background: #fff;
      color: #111;
      border-radius: 4px;
      padding: 7px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover {
      background: #f9f9f9;
      border-color: #888;
    }

    .btn.primary {
      background: var(--lc-red);
      color: #fff;
      border-color: var(--lc-red);
    }

    .workspace {
      padding: 12px;
    }

    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      max-width: 1500px;
      margin: 0 auto;
      align-items: start;
    }

    .order-panel {
      min-width: 0;
    }

    .pdf-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .file-name {
      color: var(--muted);
      font-weight: 400;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .black-box {
      background: #fff;
      border: 3px solid #000;
      padding: 8px;
      margin-bottom: 12px;
    }

    .client-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 9px;
      min-height: 120px;
      align-content: start;
    }

    .field label {
      display: block;
      margin-bottom: 3px;
      color: #333;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    .field input {
      width: 100%;
      height: 26px;
      border: 1px solid #c7c7c7;
      background: #fafafa;
      padding: 5px 6px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--lc-yellow);
      box-shadow: 0 0 0 3px var(--focus);
      background: #fff;
    }

    .products-box {
      min-height: calc(100vh - 230px);
      overflow: auto;
    }

    .excel-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    .excel-table th,
    .excel-table td {
      border: 1px solid #d9d9d9;
      padding: 0;
      vertical-align: middle;
    }

    .excel-table th {
      height: 26px;
      padding: 6px 8px;
      background: #eeeeee;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .excel-table th.qty,
    .excel-table td.qty {
      width: 90px;
    }

    .excel-table input {
      width: 100%;
      height: 28px;
      border: 0;
      outline: none;
      background: transparent;
      padding: 6px 8px;
      font-size: 10px;
    }

    .excel-table tr:hover input {
      background: #fffdf1;
    }

    .status {
      max-width: 1500px;
      min-height: 18px;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 10px;
    }

    .print-area {
      display: none;
    }

    @media (max-width: 920px) {
      .topbar {
        height: auto;
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
        justify-content: flex-start;
      }

      .boards {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        background: #fff !important;
      }

      .topbar,
      .workspace,
      .status {
        display: none !important;
      }

      .print-area {
        display: block !important;
      }

      @page {
        size: A4 portrait;
        margin: 7mm;
      }

      .print-page {
        position: relative;
        width: 196mm;
        height: 283mm;
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 8mm;
        page-break-after: always;
        break-after: page;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        color: #000;
      }

      .print-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      .print-page::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        border-left: 1px dashed #b7b7b7;
        transform: translateX(-.5px);
      }

      .print-order {
        min-width: 0;
        padding: 0 2mm;
      }

      .print-head {
        margin-bottom: 4mm;
        line-height: 1.28;
      }

      .print-title {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 2mm;
      }

      .print-meta {
        font-size: 10px;
      }

      .print-meta b {
        font-weight: 700;
      }

      .print-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 10px;
      }

      .print-table th {
        text-align: left;
        font-size: 10px;
        font-weight: 700;
        border-bottom: 1px solid #999;
        padding: 1.3mm 1mm;
      }

      .print-table td {
        vertical-align: top;
        border-bottom: 1px solid #dedede;
        padding: 1.2mm 1mm;
        line-height: 1.22;
        page-break-inside: avoid;
        break-inside: avoid;
        white-space: normal;
        overflow-wrap: break-word;
        word-break: normal;
      }

      .print-table .qty {
        width: 23mm;
        white-space: nowrap;
      }

      .print-row {
        page-break-inside: avoid;
        break-inside: avoid;
      }

      .continuation {
        font-size: 10px;
        font-weight: 700;
        margin: 0 0 2mm;
      }
    }
  </style>
</head>

    const fieldLabels = {
      clientName: 'Cliente',
      orderNumber: 'Pedido',
      date: 'Fecha',
      rut: 'RUT',
      preparedBy: 'Pedido preparado por',
      billedBy: 'Pedido facturado por'
    };

    const statusMsg = document.getElementById('statusMsg');

    function createEmptyOrder() {
      return {
        fileName: '',
        clientName: '',
        orderNumber: '',
        date: '',
        rut: '',
        preparedBy: '',
        billedBy: '',
        products: Array.from({ length: EMPTY_ROWS }, () => ({ qty: '', desc: '' }))
      };
    }

    function setStatus(message) {
      statusMsg.textContent = message || '';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function renderClientBox(slot) {
      const box = document.getElementById(`clientBox${slot}`);
      const order = state[slot];

      box.innerHTML = Object.entries(fieldLabels).map(([key, label]) => `
        <div class="field">
          <label>${label}</label>
          <input data-slot="${slot}" data-client-key="${key}" value="${escapeHtml(order[key])}" />
        </div>
      `).join('');

      document.getElementById(`fileName${slot}`).textContent = order.fileName || 'Sin archivo adjunto';
    }

    function normalizeProducts(products) {
      const filled = products
        .map(item => ({
          qty: String(item.qty || '').trim(),
          desc: cleanDescription(String(item.desc || '').trim())
        }))
        .filter(item => item.qty || item.desc)
        .sort((a, b) => (a.desc || '').localeCompare(b.desc || '', 'es', { sensitivity: 'base' }));

      while (filled.length < EMPTY_ROWS) filled.push({ qty: '', desc: '' });
      return filled;
    }

    function renderProducts(slot) {
      state[slot].products = normalizeProducts(state[slot].products);
      const tbody = document.getElementById(`productsBody${slot}`);

      tbody.innerHTML = state[slot].products.map((item, index) => `
        <tr>
          <td class="qty"><input data-slot="${slot}" data-row="${index}" data-col="qty" value="${escapeHtml(item.qty)}"></td>
          <td><input data-slot="${slot}" data-row="${index}" data-col="desc" value="${escapeHtml(item.desc)}"></td>
        </tr>
      `).join('');
    }

    function renderAll() {
      renderClientBox(1);
      renderClientBox(2);
      renderProducts(1);
      renderProducts(2);
      buildPrintArea();
    }

    document.addEventListener('input', (event) => {
      const slot = event.target.dataset.slot;
      const key = event.target.dataset.clientKey;
      const row = event.target.dataset.row;
      const col = event.target.dataset.col;

      if (slot && key) {
        state[slot][key] = event.target.value;
        buildPrintArea();
      }

      if (slot && row !== undefined && col) {
        state[slot].products[Number(row)][col] = event.target.value;
      }
    });

    document.addEventListener('change', (event) => {
      const slot = event.target.dataset.slot;
      const row = event.target.dataset.row;
      const col = event.target.dataset.col;

      if (slot && row !== undefined && col) {
        state[slot].products = normalizeProducts(state[slot].products);
        renderProducts(Number(slot));
        buildPrintArea();
      }

      if (slot && event.target.dataset.clientKey) {
        buildPrintArea();
      }
    });

    document.getElementById('attach1Btn').addEventListener('click', () => document.getElementById('fileInput1').click());
    document.getElementById('attach2Btn').addEventListener('click', () => document.getElementById('fileInput2').click());

    document.getElementById('fileInput1').addEventListener('change', async event => {
      if (event.target.files[0]) await importPdf(event.target.files[0], 1);
      event.target.value = '';
    });

    document.getElementById('fileInput2').addEventListener('change', async event => {
      if (event.target.files[0]) await importPdf(event.target.files[0], 2);
      event.target.value = '';
    });

    document.getElementById('savePdfBtn').addEventListener('click', () => {
      savePdfDirectly();
    });

    document.getElementById('printBtn').addEventListener('click', () => {
      buildPrintArea();
      window.print();
    });

    async function importPdf(file, slot) {
      try {
        setStatus(`Leyendo ${file.name}...`);

        if (!window.pdfjsLib) {
          alert('No se pudo cargar el lector PDF. Revisá la conexión a internet y recargá la página.');
          return;
        }

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

        let text = '';
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);
          text += await extractPageText(page);
          text += '\n';
        }

        await ensureProductCatalogLoaded();
        const parsed = parseOrder(text);
        state[slot] = {
          ...createEmptyOrder(),
          fileName: file.name,
          clientName: parsed.clientName,
          orderNumber: parsed.orderNumber,
          date: parsed.date,
          rut: parsed.rut,
          preparedBy: '',
          billedBy: '',
          products: normalizeProducts(parsed.products)
        };

        renderAll();

        const rutMsg = parsed.rut ? ` RUT detectado: ${parsed.rut}.` : ' RUT vacío: no se encontró un RUT de 12 dígitos en el campo RUT del cliente.';
        const catalogMsg = isStrictCatalogEnabled()
          ? ` Catálogo activo: ${productCatalog.length} productos (${catalogSource}).`
          : ` Catálogo completo no disponible; se usó filtro inteligente (${catalogSource}).`;
        setStatus(`${file.name} importado en PDF ${slot}. ${parsed.products.length} productos válidos detectados.${rutMsg}${catalogMsg}`);
      } catch (error) {
        console.error(error);
        setStatus('No se pudo leer el PDF. Probá nuevamente o revisá si el PDF tiene texto seleccionable.');
        alert('No se pudo leer el PDF correctamente.');
      }
    }

    async function extractPageText(page) {
      const content = await page.getTextContent();
      const rows = new Map();

      for (const item of content.items) {
        const y = Math.round(item.transform[5]);
        if (!rows.has(y)) rows.set(y, []);
        rows.get(y).push({
          x: item.transform[4],
          text: item.str
        });
      }

      return Array.from(rows.entries())
        .sort((a, b) => b[0] - a[0])
        .map(([, items]) => items
          .sort((a, b) => a.x - b.x)
          .map(item => item.text)
          .join(' ')
          .replace(/\s+/g, ' ')
          .trim()
        )
        .filter(Boolean)
        .join('\n');
    }

    async function ensureProductCatalogLoaded() {
      if (catalogLoaded) return;
      catalogLoaded = true;

      const catalog = new Set();
      addProductsToCatalog(catalog, STATIC_PRODUCT_CATALOG);

      if (Array.isArray(window.LA_CATALANA_PRODUCT_CATALOG)) {
        addProductsToCatalog(catalog, window.LA_CATALANA_PRODUCT_CATALOG);
        if (catalog.size >= CATALOG_PRODUCT_MINIMUM_FOR_STRICT_MODE) {
          catalogSource = 'catálogo embebido manual';
          finalizeCatalog(catalog);
          return;
        }
      }

      const fetchedProducts = await fetchCatalogFromWebsite();
      if (fetchedProducts.length) {
        addProductsToCatalog(catalog, fetchedProducts);
        catalogSource = `web La Catalana, ${fetchedProducts.length} productos leídos`;
      }

      finalizeCatalog(catalog);
    }

    function addProductsToCatalog(catalog, products) {
      for (const product of products || []) {
        const clean = cleanDescription(product);
        if (clean) catalog.add(clean);
      }
    }

    function finalizeCatalog(catalog) {
      productCatalog = Array.from(catalog).sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
      productCatalogIndex = new Map(productCatalog.map(name => [normalizeProductKey(name), name]));
      if (productCatalog.length < CATALOG_PRODUCT_MINIMUM_FOR_STRICT_MODE && catalogSource === 'filtro inteligente') {
        catalogSource = 'referencia mínima + filtro inteligente';
      }
    }

    async function fetchCatalogFromWebsite() {
      const urls = buildCatalogUrls();
      const found = new Set();
      let emptyPages = 0;

      for (const url of urls) {
        try {
          const response = await fetch(url, { cache: 'no-store', credentials: 'omit' });
          if (!response.ok) continue;
          const html = await response.text();
          const products = extractProductNamesFromHtml(html);
          products.forEach(product => found.add(product));
          if (!products.length) emptyPages += 1;
          else emptyPages = 0;
          if (emptyPages >= 4 && found.size > 0) break;
          if (found.size >= 900) break;
        } catch (error) {
          // En GitHub Pages puede bloquear CORS. Si se aloja en el mismo dominio, debería funcionar.
          break;
        }
      }

      return Array.from(found);
    }

    function buildCatalogUrls() {
      const base = 'https://lacatalanamayorista.uy/shop';
      const urls = [`${base}?ppg=1000`, `${base}?ppg=200`, base];
      for (let page = 1; page <= 60; page++) {
        urls.push(`${base}/page/${page}?ppg=100`);
        urls.push(`${base}/page/${page}`);
      }
      return urls;
    }

    function extractProductNamesFromHtml(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const candidates = [];

      doc.querySelectorAll('a[href*="/shop/product"], a[href*="/product/"]').forEach(anchor => {
        const text = cleanDescription(anchor.textContent);
        if (isPossibleCatalogProductName(text)) candidates.push(text);
      });

      doc.querySelectorAll('.oe_product_cart, .o_wsale_product_grid_wrapper, .o_wsale_product_information, .o_wsale_product_sub').forEach(card => {
        const link = card.querySelector('a[href*="/shop/product"], a[href*="/product/"]');
        const text = cleanDescription(link ? link.textContent : card.textContent);
        if (isPossibleCatalogProductName(text)) candidates.push(text);
      });

      return [...new Set(candidates.map(removeCatalogPriceNoise).filter(isPossibleCatalogProductName))];
    }

    function removeCatalogPriceNoise(text) {
      return cleanDescription(String(text || '')
        .replace(/\$\s*[0-9.,]+.*/g, '')
        .replace(/Agregar al carrito.*/i, '')
        .replace(/Añadir al carrito.*/i, '')
      );
    }

    function isPossibleCatalogProductName(text) {
      const clean = cleanDescription(text);
      if (clean.length < 3 || clean.length > 140) return false;
      if (/^(Inicio|Nosotros|Contacto|Cat[aá]logo|Buscar|Carrito|Ordenar|Precio|Cantidad|Producto)$/i.test(clean)) return false;
      if (/^(Envíos?|Tu carrito|Iniciar sesión|Crear cuenta|Añadir|Agregar)$/i.test(clean)) return false;
      if (/[@]|https?:\/\//i.test(clean)) return false;
      return /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(clean);
    }

    function isStrictCatalogEnabled() {
      return productCatalog.length >= CATALOG_PRODUCT_MINIMUM_FOR_STRICT_MODE;
    }

    function normalizeProductKey(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .replace(/Ñ/g, 'N')
        .replace(/[()\[\]{}.,;:º°]/g, ' ')
        .replace(/\bX\s+(\d+)/g, 'X$1')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getBaseProductText(description) {
      return cleanDescription(String(description || '')
        .replace(/\s+-\s+Tipo:.*$/i, '')
        .replace(/\s+Tipo:.*$/i, '')
        .replace(/\s+-\s+Formato de Venta:.*$/i, '')
        .replace(/\s+Formato de Venta:.*$/i, '')
      );
    }

    function findCatalogMatch(description) {
      if (!isStrictCatalogEnabled()) return true;

      const base = normalizeProductKey(getBaseProductText(description));
      const full = normalizeProductKey(description);
      if (!base && !full) return false;

      if (productCatalogIndex.has(base)) return productCatalogIndex.get(base);
      if (productCatalogIndex.has(full)) return productCatalogIndex.get(full);

      for (const [key, original] of productCatalogIndex.entries()) {
        if (base && (base.startsWith(key) || key.startsWith(base))) return original;
        if (full && full.startsWith(key)) return original;
      }

      return false;
    }

    function parseOrder(text) {
      const lines = text
        .split(/\n+/)
        .map(line => line.replace(/\s+/g, ' ').trim())
        .filter(Boolean);

      return {
        clientName: extractClient(lines),
        orderNumber: extractOrderNumber(text),
        date: extractDate(lines),
        rut: extractClientRut(lines),
        products: extractProducts(lines)
      };
    }

    function extractClient(lines) {
      for (const line of lines) {
        if (/MVD\s*Gestiona/i.test(line)) continue;
        if (/^Florencia\b/i.test(line)) continue;
        if (/^Montevideo\b/i.test(line)) continue;
        if (/^Uruguay$/i.test(line)) continue;
        if (/^RUT\s*:/i.test(line)) continue;
        if (/N[uú]mero de orden/i.test(line)) continue;
        if (/Fecha de la orden/i.test(line)) continue;
        if (/DESCRIPCI[OÓ]N/i.test(line)) continue;
        return line;
      }
      return '';
    }

    function extractOrderNumber(text) {
      const direct = text.match(/N[uú]mero\s+de\s+orden\s+(S\d+)/i);
      if (direct) return direct[1].trim();

      const any = text.match(/\bS\d{4,}\b/i);
      return any ? any[0].trim().toUpperCase() : '';
    }

    function extractDate(lines) {
      const index = lines.findIndex(line => /Fecha de la orden/i.test(line));
      if (index >= 0) {
        for (const candidate of lines.slice(index, index + 4)) {
          const match = candidate.match(/\b\d{2}\/\d{2}\/\d{4}\b/);
          if (match) return match[0];
        }
      }

      const any = lines.join(' ').match(/\b\d{2}\/\d{2}\/\d{4}\b/);
      return any ? any[0] : '';
    }

    function extractClientRut(lines) {
      const rutLine = lines.find(line => /^RUT\s*:/i.test(line));
      if (!rutLine) return '';

      const match = rutLine.match(/^RUT\s*:\s*([0-9.\-\s]+)/i);
      if (!match) return '';

      const digits = match[1].replace(/\D/g, '');
      return digits.length === 12 ? digits : '';
    }

    function extractProducts(lines) {
      const start = lines.findIndex(line => /DESCRIPCI[OÓ]N/i.test(line) && /CANTIDAD/i.test(line));
      if (start < 0) return [];

      const products = [];
      let descBuffer = [];
      let currentProduct = null;

      const finalizeCurrent = () => {
        if (!currentProduct) return;
        addProduct(products, currentProduct.qty, currentProduct.desc);
        currentProduct = null;
      };

      const appendContinuation = (line) => {
        const clean = cleanDescription(line);
        if (!clean) return;
        if (currentProduct) {
          currentProduct.desc = cleanDescription(`${currentProduct.desc} ${clean}`);
        } else {
          descBuffer.push(clean);
        }
      };

      for (const rawLine of lines.slice(start + 1)) {
        const line = rawLine.trim();
        if (!line) continue;

        if (isEndOfProductTable(line)) break;
        if (isNoiseLine(line)) continue;

        const inline = matchInlineProduct(line);
        if (inline) {
          finalizeCurrent();
          currentProduct = {
            qty: inline.qty,
            desc: cleanDescription([...descBuffer, inline.desc].join(' '))
          };
          descBuffer = [];
          continue;
        }

        const qtyOnly = matchQtyOnlyLine(line);
        if (qtyOnly) {
          if (descBuffer.length) {
            finalizeCurrent();
            addProduct(products, qtyOnly.qty, descBuffer.join(' '));
            descBuffer = [];
          } else if (currentProduct && !currentProduct.qty) {
            currentProduct.qty = qtyOnly.qty;
          }
          continue;
        }

        if (looksLikeDescriptionLine(line)) {
          if (currentProduct && !isContinuationLine(line)) {
            finalizeCurrent();
            descBuffer.push(cleanDescription(line));
          } else {
            appendContinuation(line);
          }
        }
      }

      finalizeCurrent();
      return products;
    }

    function isEndOfProductTable(line) {
      return /^(T[eé]rminos de pago|Subtotal|IVA\s*\d*%|Total\b|P[aá]gina\b)/i.test(line);
    }

    function isNoiseLine(line) {
      if (/^(PRECIO UNITARIO|IMPUESTOS|IMPORTE|DESCRIPCI[OÓ]N|CANTIDAD)$/i.test(line)) return true;
      if (/^IVA Ventas/i.test(line)) return true;
      if (/^\(22%\)$/i.test(line)) return true;
      if (/^\$\s*[0-9.]+,[0-9]{2}$/i.test(line)) return true;
      if (/^[0-9.]+,[0-9]{2}$/i.test(line)) return true;
      if (/P[aá]gina\s+\d+\s*\/\s*\d+/i.test(line)) return true;
      if (/@/.test(line)) return true;
      if (/^0?9\d{7,}/.test(line)) return true;
      return false;
    }

    function matchInlineProduct(line) {
      const regex = /^(.+?)\s+([0-9]+(?:[,.][0-9]+)?)\s*(Unidades?|Unidad|kg|g|u|lt|l)\s+(?:[0-9.]+,[0-9]{2}|IVA\b|0,00)/i;
      const match = line.match(regex);
      if (!match) return null;

      return {
        desc: cleanDescription(match[1]),
        qty: `${match[2].replace('.', ',')} ${match[3]}`
      };
    }

    function matchQtyOnlyLine(line) {
      const regex = /^([0-9]+(?:[,.][0-9]+)?)\s*(Unidades?|Unidad|kg|g|u|lt|l)\s+(?:[0-9.]+,[0-9]{2}|IVA\b|0,00)/i;
      const match = line.match(regex);
      if (!match) return null;

      return {
        qty: `${match[1].replace('.', ',')} ${match[2]}`
      };
    }

    function isContinuationLine(line) {
      return /^(Tipo|Formato de Venta|Presentaci[oó]n|Sabor|Sabores|Variedad|Contenido|Medida|Medidas|Color|Fragancia|Fragancias|Talle|Watts|Figura)\s*:/i.test(line);
    }

    function looksLikeDescriptionLine(line) {
      if (/^(Subtotal|Total|IVA|T[eé]rminos|P[aá]gina)/i.test(line)) return false;
      if (/^[0-9]+(?:[,.][0-9]+)?\s*(Unidades?|kg|g|u|lt|l)/i.test(line)) return false;
      return true;
    }

    function cleanDescription(desc) {
      return String(desc || '')
        .replace(/\s+/g, ' ')
        .replace(/\s+-\s+/g, ' - ')
        .trim();
    }

    function addProduct(products, qty, desc) {
      const clean = cleanDescription(desc);

      if (!clean) return;
      if (/^Env[ií]o\s+a\s+Montevideo/i.test(clean)) return;
      if (/^Env[ií]o\b/i.test(clean)) return;
      if (/monto m[ií]nimo no incluye cigarrillos/i.test(clean)) return;

      const catalogMatch = findCatalogMatch(clean);
      if (!catalogMatch) return;

      products.push({
        qty: cleanQuantity(qty),
        desc: clean
      });
    }

    function cleanQuantity(qty) {
      return String(qty || '')
        .replace(/\s+/g, ' ')
        .replace(/Unidades/i, 'Unidades')
        .replace(/Unidad/i, 'Unidad')
        .trim();
    }

    function getFilledOrder(slot) {
      const order = state[slot];
      return {
        ...order,
        products: normalizeProducts(order.products).filter(item => item.qty || item.desc)
      };
    }

    function chunkProducts(products) {
      const chunks = [];
      let current = [];
      let usedUnits = 0;

      for (const product of products) {
        const units = estimatePrintRowUnits(product);
        if (current.length && (usedUnits + units > MAX_PRINT_ROW_UNITS || current.length >= ROWS_PER_PRINT_PAGE)) {
          chunks.push(current);
          current = [];
          usedUnits = 0;
        }
        current.push(product);
        usedUnits += units;
      }

      if (current.length) chunks.push(current);
      return chunks.length ? chunks : [[]];
    }

    function estimatePrintRowUnits(product) {
      const descLength = String(product.desc || '').length;
      const qtyLength = String(product.qty || '').length;
      const descLines = Math.max(1, Math.ceil(descLength / 48));
      const qtyLines = Math.max(1, Math.ceil(qtyLength / 16));
      return Math.max(descLines, qtyLines);
    }


    function hasAnyOrderData() {
      return [getFilledOrder(1), getFilledOrder(2)].some(order =>
        order.clientName || order.orderNumber || order.date || order.rut || order.products.length
      );
    }

    function safePdfFileName() {
      const today = new Date().toISOString().slice(0, 10);
      const order1 = getFilledOrder(1).orderNumber || 'pdf1';
      const order2 = getFilledOrder(2).orderNumber || 'pdf2';
      const raw = `pedidos-la-catalana-${today}-${order1}-${order2}.pdf`;
      return raw.replace(/[^a-z0-9_.-]+/gi, '-').replace(/-+/g, '-');
    }

    function savePdfDirectly() {
      buildPrintArea();

      if (!hasAnyOrderData()) {
        setStatus('Primero adjuntá o cargá al menos un pedido.');
        return;
      }

      if (!window.jspdf || !window.jspdf.jsPDF) {
        setStatus('No se pudo cargar el generador de PDF. Revisá la conexión a internet y recargá la página.');
        alert('No se pudo cargar el generador de PDF. Revisá la conexión a internet y recargá la página.');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

      const order1 = getFilledOrder(1);
      const order2 = getFilledOrder(2);
      const pages1 = paginateOrderForPdf(doc, order1);
      const pages2 = paginateOrderForPdf(doc, order2);
      const totalPages = Math.max(pages1.length, pages2.length, 1);

      for (let pageIndex = 0; pageIndex < totalPages; pageIndex++) {
        if (pageIndex > 0) doc.addPage('a4', 'portrait');

        drawPdfCutLine(doc);
        drawPdfOrder(doc, order1, pages1[pageIndex] || [], 7, 7, 94, 283, pageIndex + 1, pages1.length);
        drawPdfOrder(doc, order2, pages2[pageIndex] || [], 109, 7, 94, 283, pageIndex + 1, pages2.length);
      }

      doc.save(safePdfFileName());
      setStatus('PDF guardado correctamente en tu PC.');
    }

    function drawPdfCutLine(doc) {
      doc.setDrawColor(183, 183, 183);
      doc.setLineWidth(0.15);
      if (doc.setLineDashPattern) doc.setLineDashPattern([1.2, 1.2], 0);
      doc.line(105, 7, 105, 290);
      if (doc.setLineDashPattern) doc.setLineDashPattern([], 0);
    }

    function pdfOrderHasData(order, products) {
      return order.clientName || order.orderNumber || order.date || order.rut || products.length;
    }

    function pdfHeaderHeight(order, showContinuation) {
      let h = 7; // título
      h += 5; // cliente
      h += 5; // pedido / fecha
      if (order.rut) h += 5;
      h += 5; // preparado
      h += 5; // facturado
      if (showContinuation) h += 5;
      h += 7; // espacio + encabezado tabla
      return h;
    }

    function pdfRowHeight(doc, description, descWidth) {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      const lines = doc.splitTextToSize(String(description || ''), descWidth);
      return Math.max(6, 3.9 * lines.length + 2.4);
    }

    function paginateOrderForPdf(doc, order) {
      const products = (order.products || []).filter(item => item.qty || item.desc);
      if (!products.length) return [];

      const paginate = (reserveContinuation) => {
        const maxY = 7 + 283;
        const descWidth = 94 - 4 - 23 - 2;
        const chunks = [];
        let current = [];
        let usedY = 7 + pdfHeaderHeight(order, reserveContinuation);

        products.forEach(item => {
          const rowH = pdfRowHeight(doc, item.desc, descWidth);
          if (current.length && usedY + rowH > maxY) {
            chunks.push(current);
            current = [];
            usedY = 7 + pdfHeaderHeight(order, reserveContinuation);
          }
          current.push(item);
          usedY += rowH;
        });

        if (current.length) chunks.push(current);
        return chunks;
      };

      let chunks = paginate(false);
      if (chunks.length > 1) chunks = paginate(true);
      return chunks;
    }

    function drawPdfOrder(doc, order, products, x, y, w, h, pageNumber, totalPages) {
      if (!pdfOrderHasData(order, products)) return;

      const pad = 2;
      let cursorY = y;
      const textX = x + pad;
      const qtyX = x + pad;
      const descX = x + pad + 23;
      const descWidth = w - (pad * 2) - 23;

      doc.setTextColor(0, 0, 0);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('PEDIDO WEB - LA CATALANA', textX, cursorY + 4);
      cursorY += 7;

      doc.setFont('helvetica', 'bold');
      doc.text('Cliente:', textX, cursorY + 3.5);
      doc.setFont('helvetica', 'normal');
      doc.text(String(order.clientName || '-'), textX + 15, cursorY + 3.5, { maxWidth: w - 18 });
      cursorY += 5;

      doc.setFont('helvetica', 'bold');
      doc.text('Pedido:', textX, cursorY + 3.5);
      doc.setFont('helvetica', 'normal');
      doc.text(String(order.orderNumber || '-'), textX + 15, cursorY + 3.5);
      doc.setFont('helvetica', 'bold');
      doc.text('Fecha:', textX + 47, cursorY + 3.5);
      doc.setFont('helvetica', 'normal');
      doc.text(String(order.date || '-'), textX + 60, cursorY + 3.5);
      cursorY += 5;

      if (order.rut) {
        doc.setFont('helvetica', 'bold');
        doc.text('RUT:', textX, cursorY + 3.5);
        doc.setFont('helvetica', 'normal');
        doc.text(String(order.rut), textX + 11, cursorY + 3.5);
        cursorY += 5;
      }

      doc.setFont('helvetica', 'bold');
      doc.text('Pedido preparado por:', textX, cursorY + 3.5);
      doc.setFont('helvetica', 'normal');
      doc.text(String(order.preparedBy || '________________'), textX + 40, cursorY + 3.5, { maxWidth: w - 43 });
      cursorY += 5;

      doc.setFont('helvetica', 'bold');
      doc.text('Pedido facturado por:', textX, cursorY + 3.5);
      doc.setFont('helvetica', 'normal');
      doc.text(String(order.billedBy || '________________'), textX + 40, cursorY + 3.5, { maxWidth: w - 43 });
      cursorY += 5;

      if (totalPages > 1) {
        doc.setFont('helvetica', 'bold');
        doc.text(`Continuación ${pageNumber}/${totalPages}`, textX, cursorY + 3.5);
        cursorY += 5;
      }

      cursorY += 2;
      doc.setFont('helvetica', 'bold');
      doc.text('Cantidad', qtyX, cursorY + 3.5);
      doc.text('Descripción', descX, cursorY + 3.5);
      doc.setDrawColor(153, 153, 153);
      doc.setLineWidth(0.15);
      doc.line(x + pad, cursorY + 5, x + w - pad, cursorY + 5);
      cursorY += 8;

      products.forEach(item => {
        const descLines = doc.splitTextToSize(String(item.desc || ''), descWidth);
        const rowH = Math.max(6, 3.9 * descLines.length + 2.4);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.text(String(item.qty || ''), qtyX, cursorY + 3.7, { maxWidth: 22 });
        doc.text(descLines, descX, cursorY + 3.7);

        doc.setDrawColor(222, 222, 222);
        doc.setLineWidth(0.1);
        doc.line(x + pad, cursorY + rowH, x + w - pad, cursorY + rowH);
        cursorY += rowH;
      });
    }

    function buildPrintArea() {
      const order1 = getFilledOrder(1);
      const order2 = getFilledOrder(2);

      const chunks1 = chunkProducts(order1.products);
      const chunks2 = chunkProducts(order2.products);
      const totalPages = Math.max(chunks1.length, chunks2.length);

      const pages = [];
      for (let page = 0; page < totalPages; page++) {
        pages.push(`
          <section class="print-page">
            ${renderPrintOrder(order1, chunks1[page] || [], page + 1, chunks1.length)}
            ${renderPrintOrder(order2, chunks2[page] || [], page + 1, chunks2.length)}
          </section>
        `);
      }

      document.getElementById('printArea').innerHTML = pages.join('');
    }

    function renderPrintOrder(order, products, pageNumber, totalPages) {
      const hasData = order.clientName || order.orderNumber || order.date || order.rut || products.length;
      if (!hasData) {
        return '<article class="print-order"></article>';
      }

      const continuation = totalPages > 1
        ? `<div class="continuation">Continuación ${pageNumber}/${totalPages}</div>`
        : '';

      const rutLine = order.rut ? `<div><b>RUT:</b> ${escapeHtml(order.rut)}</div>` : '';

      return `
        <article class="print-order">
          <header class="print-head">
            <div class="print-title">Pedido Web - La Catalana</div>
            <div class="print-meta">
              <div><b>Cliente:</b> ${escapeHtml(order.clientName || '-')}</div>
              <div><b>Pedido:</b> ${escapeHtml(order.orderNumber || '-')}</div>
              <div><b>Fecha:</b> ${escapeHtml(order.date || '-')}</div>
              ${rutLine}
              <div><b>Pedido preparado por:</b> ${escapeHtml(order.preparedBy || '________________')}</div>
              <div><b>Pedido facturado por:</b> ${escapeHtml(order.billedBy || '________________')}</div>
            </div>
          </header>

          ${continuation}

          <table class="print-table">
            <thead>
              <tr>
                <th class="qty">Cantidad</th>
                <th>Descripción</th>
              </tr>
            </thead>
            <tbody>
              ${products.map(item => `
                <tr class="print-row">
                  <td class="qty">${escapeHtml(item.qty)}</td>
                  <td>${escapeHtml(item.desc)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </article>
      `;
    }

    renderAll();
  </script>
</body>
</html>
