<!DOCTYPE html>
<html lang="es-UY">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos Web - La Catalana v15</title>
  <style>
    :root{
      --bg:#e7e7e7;
      --panel:#fff;
      --line:#111;
      --soft:#d9d9d9;
      --head:#efefef;
      --text:#111;
      --muted:#555;
      --brand:#5B2725;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;font-size:10px;color:var(--text)}
    button,input{font-family:Arial,Helvetica,sans-serif;font-size:10px}
    .topbar{position:sticky;top:0;z-index:20;height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 10px;background:#f4f4f4;border-bottom:1px solid #cfcfcf}
    .brand{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:12px;white-space:nowrap}
    .brand-mark{width:22px;height:22px;border:1px solid #bdbdbd;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800}
    .actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    .btn{border:1px solid #bdbdbd;background:#fff;padding:7px 11px;border-radius:4px;cursor:pointer;font-weight:bold;color:#111}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn:hover{filter:brightness(.97)}
    .workspace{padding:10px;max-width:1480px;margin:0 auto}
    .orders-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
    .order-title{height:18px;display:flex;align-items:center;justify-content:space-between;font-weight:bold}
    .file-name{font-weight:normal;color:#444;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .order-panel{min-width:0}
    .box{border:4px solid #000;background:#fff;margin-bottom:10px;padding:10px}
    .client-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
    .field label{display:block;text-transform:uppercase;font-weight:bold;margin-bottom:3px;letter-spacing:.02em}
    .field input{width:100%;height:25px;border:1px solid #bdbdbd;background:#fdfdfd;padding:4px 6px;outline:none}
    .field input:focus{border-color:#5B2725;box-shadow:0 0 0 2px rgba(91,39,37,.12)}
    .products-box{height:calc(100vh - 210px);min-height:470px;overflow:auto}
    table.edit-table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}
    .edit-table th{position:sticky;top:0;background:#f0f0f0;z-index:2;text-align:left;border:1px solid var(--soft);height:24px;padding:5px 7px;text-transform:uppercase;font-weight:bold}
    .edit-table td{border:1px solid var(--soft);height:26px;padding:0;vertical-align:top}
    .edit-table .qty{width:86px}
    .edit-table input{width:100%;min-height:25px;border:0;background:transparent;padding:5px 7px;outline:none;font-size:10px}
    .edit-table textarea{width:100%;min-height:25px;border:0;background:transparent;padding:5px 7px;outline:none;font-family:Arial,Helvetica,sans-serif;font-size:10px;resize:vertical;line-height:1.25;overflow:hidden}
    .edit-table tr:hover td{background:#fafafa}
    .status{min-height:18px;color:#444;padding:4px 1px}
    #printArea{display:none}

    @media(max-width:1050px){.orders-grid{grid-template-columns:1fr}.products-box{height:520px}}

    @media print{
      @page{size:A4 portrait;margin:7mm}
      body{background:#fff!important}
      .topbar,.workspace{display:none!important}
      #printArea{display:block!important}
      .print-page{page-break-after:always;break-after:page;width:196mm;height:283mm;display:grid;grid-template-columns:1fr 1fr;column-gap:8mm;position:relative;font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#000}
      .print-page:last-child{page-break-after:auto;break-after:auto}
      .print-page::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #b8b8b8;transform:translateX(-4mm)}
      .print-order{min-width:0;padding:0 1mm;overflow:hidden}
      .print-title{font-weight:bold;text-transform:uppercase;margin-bottom:3mm}
      .print-meta{line-height:1.25;margin-bottom:3mm}
      .print-meta div{margin-bottom:1mm}
      .continuation{font-weight:bold;margin:1mm 0 2mm}
      .print-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px}
      .print-table th{text-align:left;font-weight:bold;border-bottom:1px solid #999;padding:1mm 0}
      .print-table td{vertical-align:top;border-bottom:1px solid #ddd;padding:1.2mm 0;line-height:1.25}
      .print-table .qty{width:24mm;padding-right:2mm}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">LC</span><span>Pedidos Web - La Catalana</span></div>
    <div class="actions">
      <button class="btn" id="attach1Btn">Adjuntar PDF 1</button>
      <button class="btn" id="attach2Btn">Adjuntar PDF 2</button>
      <button class="btn" id="savePdfBtn">Guardar PDF en PC</button>
      <button class="btn primary" id="printBtn">Imprimir PDF</button>
    </div>
    <input type="file" id="fileInput1" accept="application/pdf" hidden>
    <input type="file" id="fileInput2" accept="application/pdf" hidden>
  </header>

  <main class="workspace">
    <section class="orders-grid">
      <article class="order-panel">
        <div class="order-title"><span>PDF 1</span><span class="file-name" id="fileName1">Sin archivo adjunto</span></div>
        <div class="box client-grid" id="clientBox1"></div>
        <div class="box products-box"><table class="edit-table"><thead><tr><th class="qty">Cantidad</th><th>Descripción</th></tr></thead><tbody id="productBody1"></tbody></table></div>
      </article>
      <article class="order-panel">
        <div class="order-title"><span>PDF 2</span><span class="file-name" id="fileName2">Sin archivo adjunto</span></div>
        <div class="box client-grid" id="clientBox2"></div>
        <div class="box products-box"><table class="edit-table"><thead><tr><th class="qty">Cantidad</th><th>Descripción</th></tr></thead><tbody id="productBody2"></tbody></table></div>
      </article>
    </section>
    <div class="status" id="statusMsg"></div>
  </main>

  <div id="printArea"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    const EMPTY_ROWS = 22;
    const MAX_LINES_PER_PRINT_COLUMN = 78;
    const CATALOG_STRICT_MIN = 50;
    const CATALOG_URL = 'https://lacatalanamayorista.uy/shop';
    const CATALOG_MAX_PAGES = 60;
    const CATALOG_SEED = [
      'COCA COLA 2 L',
      'COCA COLA SABOR ORIGINAL 1 L',
      'FIAMBRE DE CERDO DOÑA COCA',
      'FINZZETA DOÑA COCA',
      'JAMON RUVI DOÑA COCA',
      'SALAME MILAN DOÑA COCA'
    ];

    let catalogLoaded = false;
    let productCatalog = [];
    let productCatalogIndex = new Map();
    let catalogSource = 'filtro inteligente';

    const state = {
      1: createEmptyOrder(),
      2: createEmptyOrder()
    };

    const labels = {
      clientName: 'Cliente',
      orderNumber: 'Pedido',
      date: 'Fecha',
      rut: 'RUT',
      preparedBy: 'Pedido preparado por',
      billedBy: 'Pedido facturado por'
    };

    const statusMsg = document.getElementById('statusMsg');

    function createEmptyOrder(){
      return {
        fileName:'', clientName:'', orderNumber:'', date:'', rut:'', preparedBy:'', billedBy:'',
        products: Array.from({length:EMPTY_ROWS}, () => ({qty:'', desc:''}))
      };
    }

    function escapeHtml(value){
      return String(value || '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }

    function cleanText(value){ return String(value || '').replace(/\s+/g,' ').trim(); }
    function setStatus(msg){ statusMsg.textContent = msg || ''; }

    function renderClientBox(slot){
      const order = state[slot];
      document.getElementById(`clientBox${slot}`).innerHTML = Object.entries(labels).map(([key,label]) => `
        <div class="field"><label>${label}</label><input data-slot="${slot}" data-client-key="${key}" value="${escapeHtml(order[key])}"></div>
      `).join('');
      document.getElementById(`fileName${slot}`).textContent = order.fileName || 'Sin archivo adjunto';
    }

    function normalizeProducts(products, shouldSort = true){
      let filled = (products || []).map(p => ({ qty: cleanText(p.qty), desc: cleanDescription(p.desc) })).filter(p => p.qty || p.desc);
      if (shouldSort) filled = filled.sort((a,b) => (a.desc || '').localeCompare(b.desc || '', 'es', { sensitivity:'base' }));
      while (filled.length < EMPTY_ROWS) filled.push({qty:'', desc:''});
      return filled;
    }

    function renderProducts(slot){
      const body = document.getElementById(`productBody${slot}`);
      body.innerHTML = state[slot].products.map((p, index) => `
        <tr>
          <td class="qty"><input data-slot="${slot}" data-row="${index}" data-col="qty" value="${escapeHtml(p.qty)}"></td>
          <td><textarea rows="1" data-slot="${slot}" data-row="${index}" data-col="desc">${escapeHtml(p.desc)}</textarea></td>
        </tr>
      `).join('');
      body.querySelectorAll('textarea').forEach(autoGrow);
    }

    function autoGrow(el){
      el.style.height = '25px';
      el.style.height = Math.max(25, el.scrollHeight) + 'px';
    }

    function renderAll(){ renderClientBox(1); renderClientBox(2); renderProducts(1); renderProducts(2); buildPrintArea(); }

    document.addEventListener('input', e => {
      const slot = e.target.dataset.slot;
      const key = e.target.dataset.clientKey;
      const row = e.target.dataset.row;
      const col = e.target.dataset.col;
      if (e.target.tagName === 'TEXTAREA') autoGrow(e.target);
      if (slot && key){ state[slot][key] = e.target.value; buildPrintArea(); }
      if (slot && row !== undefined && col){ state[slot].products[Number(row)][col] = e.target.value; buildPrintArea(); }
    });

    document.addEventListener('change', e => {
      const slot = e.target.dataset.slot;
      const row = e.target.dataset.row;
      const col = e.target.dataset.col;
      if (slot && row !== undefined && col){
        state[slot].products = normalizeProducts(state[slot].products, true);
        renderProducts(Number(slot));
        buildPrintArea();
      }
    });

    document.getElementById('attach1Btn').addEventListener('click', () => document.getElementById('fileInput1').click());
    document.getElementById('attach2Btn').addEventListener('click', () => document.getElementById('fileInput2').click());
    document.getElementById('fileInput1').addEventListener('change', async e => { if(e.target.files[0]) await importPdf(e.target.files[0], 1); e.target.value=''; });
    document.getElementById('fileInput2').addEventListener('change', async e => { if(e.target.files[0]) await importPdf(e.target.files[0], 2); e.target.value=''; });
    document.getElementById('printBtn').addEventListener('click', () => { buildPrintArea(); window.print(); });
    document.getElementById('savePdfBtn').addEventListener('click', savePdfDirectly);

    async function importPdf(file, slot){
      try{
        setStatus(`Leyendo ${file.name}...`);
        if(!window.pdfjsLib){ alert('No se pudo cargar el lector PDF. Revisá la conexión y recargá la página.'); return; }
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data:buffer}).promise;
        const pages = [];
        for(let i=1;i<=pdf.numPages;i++){
          const page = await pdf.getPage(i);
          pages.push(await extractPageStructured(page));
        }
        ensureProductCatalogLoaded();
        const parsed = parseStructuredOrder(pages);
        state[slot] = {
          ...createEmptyOrder(),
          fileName:file.name,
          clientName: parsed.clientName,
          orderNumber: parsed.orderNumber,
          date: parsed.date,
          rut: parsed.rut,
          preparedBy:'',
          billedBy:'',
          products: normalizeProducts(parsed.products, true)
        };
        renderAll();
        setStatus(`${file.name} importado en PDF ${slot}: ${parsed.products.length} productos copiados. Campos detectados: cliente, pedido, fecha, RUT válido si corresponde, cantidad y descripción.`);
      }catch(err){
        console.error(err);
        setStatus('No se pudo leer el PDF. Verificá que sea una orden con texto seleccionable.');
        alert('No se pudo leer el PDF correctamente.');
      }
    }

    async function extractPageStructured(page){
      const viewport = page.getViewport({scale:1});
      const content = await page.getTextContent();
      const items = content.items.map(item => ({
        x: item.transform[4],
        y: item.transform[5],
        text: cleanText(item.str)
      })).filter(item => item.text);

      const rows = groupItemsIntoRows(items);
      return { width: viewport.width, height: viewport.height, rows, text: rows.map(r => r.text).join('\n') };
    }

    function groupItemsIntoRows(items){
      const sorted = [...items].sort((a,b) => b.y - a.y || a.x - b.x);
      const rows = [];
      const tolerance = 3;
      for(const item of sorted){
        let row = rows.find(r => Math.abs(r.y - item.y) <= tolerance);
        if(!row){ row = { y:item.y, items:[] }; rows.push(row); }
        row.items.push(item);
        row.y = (row.y * (row.items.length - 1) + item.y) / row.items.length;
      }
      return rows.sort((a,b) => b.y - a.y).map(row => {
        row.items.sort((a,b) => a.x - b.x);
        row.text = cleanText(row.items.map(i => i.text).join(' '));
        return row;
      }).filter(row => row.text);
    }

    function parseStructuredOrder(pages){
      const allText = pages.map(p => p.text).join('\n');
      const lines = allText.split(/\n+/).map(cleanText).filter(Boolean);
      return {
        clientName: extractClient(lines),
        orderNumber: extractOrderNumber(allText),
        date: extractDate(lines),
        rut: extractClientRut(lines),
        products: extractProductsFromTableRows(pages)
      };
    }

    function extractClient(lines){
      for(const line of lines){
        if(/MVD\s*Gestiona/i.test(line)) continue;
        if(/^N[uú]mero\s+de\s+orden/i.test(line)) continue;
        if(/^Fecha\s+de\s+la\s+orden/i.test(line)) continue;
        if(/^DESCRIPCI[OÓ]N/i.test(line)) continue;
        if(/^RUT\s*:?/i.test(line)) continue;
        if(/^Uruguay$/i.test(line)) continue;
        if(/^Montevideo\b/i.test(line)) continue;
        if(/^Subtotal|^IVA\s*\d|^Total\b|^T[eé]rminos/i.test(line)) continue;
        return line;
      }
      return '';
    }

    function extractOrderNumber(text){
      const direct = text.match(/N[uú]mero\s+de\s+orden\s+(S\d+)/i);
      if(direct) return direct[1].toUpperCase();
      const any = text.match(/\bS\d{4,}\b/i);
      return any ? any[0].toUpperCase() : '';
    }

    function extractDate(lines){
      const idx = lines.findIndex(l => /Fecha\s+de\s+la\s+orden/i.test(l));
      if(idx >= 0){
        for(const line of lines.slice(idx, idx + 4)){
          const m = line.match(/\b\d{2}\/\d{2}\/\d{4}\b/);
          if(m) return m[0];
        }
      }
      const any = lines.join(' ').match(/\b\d{2}\/\d{2}\/\d{4}\b/);
      return any ? any[0] : '';
    }

    function extractClientRut(lines){
      const rutLine = lines.find(l => /^RUT\s*:?/i.test(l));
      if(!rutLine) return '';
      const afterRut = rutLine.replace(/^RUT\s*:?\s*/i, '').replace(/N[uú]mero\s+de\s+orden.*$/i, '');
      const digits = afterRut.replace(/\D/g, '');
      return digits.length === 12 ? digits : '';
    }

    function extractProductsFromTableRows(pages){
      // Para las ordenes de La Catalana, la referencia mas confiable es la posicion real de la tabla.
      // Primero usamos coordenadas para que las lineas 'Tipo:' y 'Formato de Venta:' queden pegadas al producto correcto.
      const byCoordinates = extractProductsByCoordinates(pages);
      if(byCoordinates.length) return byCoordinates;
      return extractProductsFromSequentialText(pages);
    }

    function extractProductsFromSequentialText(pages){
      const products = [];
      let activeTable = false;
      let buffer = [];

      const flush = (qty, inlineDesc = '') => {
        const desc = cleanDescription([...buffer, inlineDesc].filter(Boolean).join(' '));
        buffer = [];
        addValidProduct(products, qty, desc);
      };

      for(const page of pages){
        const lines = page.text.split(/\n+/).map(cleanText).filter(Boolean);
        for(const rawLine of lines){
          let line = cleanText(rawLine);
          if(!line) continue;

          if(/DESCRIPCI[OÓ]N\s+CANTIDAD/i.test(line) || (/^DESCRIPCI[OÓ]N$/i.test(line) && !activeTable)){
            activeTable = true;
            buffer = [];
            continue;
          }
          if(!activeTable) continue;

          if(isEndOfProductTable(line)){
            activeTable = false;
            buffer = [];
            continue;
          }
          if(isVisualNoiseRow(line)) continue;
          if(/^(PRECIO\s+UNITARIO|IMPUESTOS|IMPORTE)$/i.test(line)) continue;

          const qtyMatch = line.match(/\b([0-9]+(?:[,.][0-9]+)?)\s*(Unidades?|Unidad|kg|g|lt|l|u)\b/i);
          if(qtyMatch){
            const qty = `${qtyMatch[1].replace('.', ',')} ${qtyMatch[2]}`;
            const beforeQty = cleanDescription(line.slice(0, qtyMatch.index));
            flush(qty, beforeQty);
            continue;
          }

          if(isNonProductDescription(line)){
            buffer = [line];
            continue;
          }

          // Todo texto de la columna descripción queda acumulado hasta encontrar su cantidad.
          // Así se respetan filas con varias líneas: producto + Tipo + Formato de Venta.
          if(!/^(IVA\s+Ventas|\(22%\)|\$|Subtotal|Total|T[eé]rminos)/i.test(line)){
            buffer.push(line);
          }
        }
      }

      return mergeDuplicateProductRows(products);
    }

    function extractProductsByCoordinates(pages){
      const products = [];
      for(const page of pages){
        const headerIndex = page.rows.findIndex(row => /DESCRIPCI[OÓ]N/i.test(row.text) && /CANTIDAD/i.test(row.text));
        if(headerIndex < 0) continue;
        const header = page.rows[headerIndex];
        const qtyX = findHeaderX(header, /CANTIDAD/i, 285);
        const priceX = findHeaderX(header, /PRECIO/i, 350);
        const descMaxX = qtyX - 20;
        const qtyMinX = qtyX - 18;
        const qtyMaxX = priceX - 6;
        let current = null;

        const finishCurrent = () => {
          if(!current) return;
          addValidProduct(products, current.qty, current.desc);
          current = null;
        };

        for(const row of page.rows.slice(headerIndex + 1)){
          if(isEndOfProductTable(row.text)) break;
          if(isVisualNoiseRow(row.text)) continue;

          const descText = cleanDescription(row.items.filter(i => i.x < descMaxX).map(i => i.text).join(' '));
          const qtyText = cleanText(row.items.filter(i => i.x >= qtyMinX && i.x < qtyMaxX).map(i => i.text).join(' '));
          const qty = extractQuantity(qtyText);

          // Cuando la fila trae cantidad, empieza un producto nuevo.
          // Importante: NO se cierra enseguida, porque las filas visuales siguientes pueden ser
          // la continuacion de la misma descripcion: 'Tipo:' / 'Formato de Venta:'.
          if(qty){
            finishCurrent();
            current = { qty, desc: descText };
            continue;
          }

          // Si no hay cantidad y hay texto en la columna descripcion, se agrega al producto activo.
          // Esto corrige casos como FIAMBRE/JAMON/SALAME donde Odoo muestra Tipo y Formato debajo.
          if(descText && current){
            current.desc = cleanDescription(`${current.desc} ${descText}`);
          }
        }
        finishCurrent();
      }
      return mergeDuplicateProductRows(products);
    }

    function mergeDuplicateProductRows(products){
      // Mantiene filas separadas, solo limpia espacios y descarta vacíos.
      return (products || []).map(p => ({ qty: cleanQuantity(p.qty), desc: cleanDescription(p.desc) })).filter(p => p.qty && p.desc);
    }

    function findHeaderX(row, regex, fallback){
      const item = row.items.find(i => regex.test(i.text));
      return item ? item.x : fallback;
    }

    function extractQuantity(text){
      const m = cleanText(text).match(/([0-9]+(?:[,.][0-9]+)?)\s*(Unidades?|Unidad|kg|g|lt|l|u)\b/i);
      if(!m) return '';
      return `${m[1].replace('.', ',')} ${m[2]}`;
    }

    function isEndOfProductTable(text){ return /^(T[eé]rminos\s+de\s+pago|Subtotal\b|IVA\s*\d*%|Total\b|P[aá]gina\b)/i.test(cleanText(text)); }
    function isVisualNoiseRow(text){
      const t = cleanText(text);
      if(!t) return true;
      if(/^IVA Ventas/i.test(t)) return true;
      if(/^\(22%\)$/i.test(t)) return true;
      if(/^\$\s*[0-9.]+,[0-9]{2}$/i.test(t)) return true;
      if(/^[0-9.]+,[0-9]{2}$/i.test(t)) return true;
      if(/@/.test(t)) return true;
      if(/^0?9\d{7,}/.test(t)) return true;
      if(/P[aá]gina\s+\d+\s*\/\s*\d+/i.test(t)) return true;
      return false;
    }

    function isNonProductDescription(text){
      const t = cleanDescription(text);
      return /^Env[ií]o\b/i.test(t) || /Montevideo en compras superiores/i.test(t) || /monto m[ií]nimo no incluye/i.test(t);
    }

    function isContinuationDescription(text){ return /^(Tipo:|Formato\s+de\s+Venta:|Sabor:|Color:|Talle:|Presentaci[oó]n:)/i.test(cleanDescription(text)); }

    function isLikelyNewProductName(text){
      const t = cleanDescription(text);
      if(isNonProductDescription(t)) return false;
      if(isContinuationDescription(t)) return false;
      if(t.length < 3 || t.length > 160) return false;
      return /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(t);
    }

    function cleanDescription(text){ return cleanText(text).replace(/\s+-\s+/g, ' - '); }

    function baseProductText(desc){
      return cleanDescription(String(desc || '')
        .replace(/\s+Tipo:\s*.*$/i, '')
        .replace(/\s+Formato\s+de\s+Venta:\s*.*$/i, '')
        .replace(/\s*\([^)]*\)\s*$/g, '')
      );
    }

    function addValidProduct(products, qty, desc){
      const clean = cleanDescription(desc);
      if(!clean || !qty) return;
      if(isNonProductDescription(clean)) return;
      if(!matchesCatalogOrSmartFilter(clean)) return;
      products.push({ qty: cleanQuantity(qty), desc: clean });
    }

    function cleanQuantity(qty){ return cleanText(qty).replace(/unidades/i,'Unidades').replace(/unidad/i,'Unidad'); }

    function ensureProductCatalogLoaded(){
      if(catalogLoaded) return;
      const set = new Set();
      CATALOG_SEED.forEach(p => set.add(cleanDescription(p)));
      if(Array.isArray(window.LA_CATALANA_PRODUCT_CATALOG)) window.LA_CATALANA_PRODUCT_CATALOG.forEach(p => set.add(cleanDescription(p)));
      productCatalog = [...set].filter(Boolean);
      productCatalogIndex = new Map(productCatalog.map(p => [normalizeKey(p), p]));
      catalogLoaded = true;
      catalogSource = 'validación rápida local';
    }

    function normalizeKey(value){
      return String(value || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .toUpperCase()
        .replace(/Ñ/g,'N')
        .replace(/\bX\s*([0-9]+)\s*U\.?\b/g,'X$1U')
        .replace(/[()\[\]{}.,;:º°]/g,' ')
        .replace(/\bUNIDADES?\b/g,'U')
        .replace(/\s+/g,' ')
        .trim();
    }

    function isStrictCatalogEnabled(){ return productCatalog.length >= CATALOG_STRICT_MIN; }

    function matchesCatalogOrSmartFilter(desc){
      const clean = cleanDescription(desc);
      if(!clean || isNonProductDescription(clean)) return false;

      const base = normalizeKey(baseProductText(clean));
      const full = normalizeKey(clean);

      // Coincidencia exacta/parcial con catálogo local o catálogo manual embebido.
      if(productCatalogIndex.has(base) || productCatalogIndex.has(full)) return true;
      for(const key of productCatalogIndex.keys()){
        if(!key) continue;
        if(base && (base === key || base.startsWith(key) || key.startsWith(base))) return true;
        if(full && (full === key || full.startsWith(key) || key.startsWith(full))) return true;
      }

      // Filtro inteligente para no romper la importación cuando el navegador no permite leer el catálogo web.
      // Excluye servicios, totales, precios, impuestos y texto administrativo; conserva productos reales del pedido.
      if(/ENVIO|MONTEVIDEO|TERMINOS|SUBTOTAL|TOTAL|IVA|IMPUESTOS|IMPORTE|PAGO|PAGINA|RUT|NUMERO DE ORDEN|FECHA DE LA ORDEN/.test(full)) return false;
      if(/@|\$|UYU|WWW|HTTP/.test(full)) return false;
      if(full.length < 4 || full.length > 180) return false;
      if(!/[A-ZÁÉÍÓÚÜÑ]/.test(clean)) return false;
      return true;
    }

    function getFilledOrder(slot){
      return {...state[slot], products: normalizeProducts(state[slot].products, true).filter(p => p.qty || p.desc)};
    }

    function estimateLineCount(text, charsPerLine){ return Math.max(1, Math.ceil(String(text || '').length / charsPerLine)); }

    function paginateOrder(order){
      const products = order.products || [];
      const pages = [];
      let current = [];
      let used = headerLineCount(order);
      for(const p of products){
        const lines = Math.max(1, estimateLineCount(p.desc, 42));
        if(current.length && used + lines + 1 > MAX_LINES_PER_PRINT_COLUMN){
          pages.push(current); current = []; used = headerLineCount(order) + 1;
        }
        current.push(p); used += lines + 1;
      }
      if(current.length) pages.push(current);
      return pages.length ? pages : [[]];
    }

    function headerLineCount(order){ return 9 + (order.rut ? 1 : 0); }

    function buildPrintArea(){
      const order1 = getFilledOrder(1), order2 = getFilledOrder(2);
      const pages1 = paginateOrder(order1), pages2 = paginateOrder(order2);
      const total = Math.max(pages1.length, pages2.length, 1);
      const pages = [];
      for(let i=0; i<total; i++){
        pages.push(`<section class="print-page">${renderPrintOrder(order1, pages1[i] || [], i+1, pages1.length)}${renderPrintOrder(order2, pages2[i] || [], i+1, pages2.length)}</section>`);
      }
      document.getElementById('printArea').innerHTML = pages.join('');
    }

    function renderPrintOrder(order, products, page, total){
      if(!(order.clientName || order.orderNumber || order.date || order.rut || products.length)) return '<article class="print-order"></article>';
      return `<article class="print-order">
        <div class="print-title">Pedido Web - La Catalana</div>
        <div class="print-meta">
          <div><b>Cliente:</b> ${escapeHtml(order.clientName || '-')}</div>
          <div><b>Pedido:</b> ${escapeHtml(order.orderNumber || '-')}</div>
          <div><b>Fecha:</b> ${escapeHtml(order.date || '-')}</div>
          ${order.rut ? `<div><b>RUT:</b> ${escapeHtml(order.rut)}</div>` : ''}
          <div><b>Pedido preparado por:</b> ${escapeHtml(order.preparedBy || '________________')}</div>
          <div><b>Pedido facturado por:</b> ${escapeHtml(order.billedBy || '________________')}</div>
        </div>
        ${total > 1 ? `<div class="continuation">Continuación ${page}/${total}</div>` : ''}
        <table class="print-table"><thead><tr><th class="qty">Cantidad</th><th>Descripción</th></tr></thead><tbody>
          ${products.map(p => `<tr><td class="qty">${escapeHtml(p.qty)}</td><td>${escapeHtml(p.desc)}</td></tr>`).join('')}
        </tbody></table>
      </article>`;
    }

    function hasAnyOrderData(){ return [getFilledOrder(1), getFilledOrder(2)].some(o => o.clientName || o.orderNumber || o.date || o.rut || o.products.length); }

    function safePdfFileName(){
      const today = new Date().toISOString().slice(0,10);
      const o1 = getFilledOrder(1).orderNumber || 'pdf1';
      const o2 = getFilledOrder(2).orderNumber || 'pdf2';
      return `pedidos-la-catalana-${today}-${o1}-${o2}.pdf`.replace(/[^a-z0-9_.-]+/gi,'-').replace(/-+/g,'-');
    }

    function savePdfDirectly(){
      if(!hasAnyOrderData()){ setStatus('Primero adjuntá al menos un pedido.'); return; }
      if(!window.jspdf || !window.jspdf.jsPDF){ alert('No se pudo cargar el generador de PDF. Revisá la conexión y recargá la página.'); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
      const order1 = getFilledOrder(1), order2 = getFilledOrder(2);
      const pages1 = paginateOrder(order1), pages2 = paginateOrder(order2);
      const total = Math.max(pages1.length, pages2.length, 1);
      for(let i=0; i<total; i++){
        if(i>0) doc.addPage('a4','portrait');
        drawCutLine(doc);
        drawPdfOrder(doc, order1, pages1[i] || [], 7, 7, 94, 283, i+1, pages1.length);
        drawPdfOrder(doc, order2, pages2[i] || [], 109, 7, 94, 283, i+1, pages2.length);
      }
      doc.save(safePdfFileName());
      setStatus('PDF guardado correctamente en tu PC.');
    }

    function drawCutLine(doc){
      doc.setDrawColor(183,183,183); doc.setLineWidth(.15);
      if(doc.setLineDashPattern) doc.setLineDashPattern([1.2,1.2],0);
      doc.line(105,7,105,290);
      if(doc.setLineDashPattern) doc.setLineDashPattern([],0);
    }

    function drawPdfOrder(doc, order, products, x, y, w, h, page, total){
      if(!(order.clientName || order.orderNumber || order.date || order.rut || products.length)) return;
      const pad = 2, qtyW = 23, descW = w - pad*2 - qtyW;
      let cy = y;
      doc.setTextColor(0,0,0); doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text('PEDIDO WEB - LA CATALANA', x+pad, cy+4); cy += 7;
      doc.setFont('helvetica','bold'); doc.text('Cliente:', x+pad, cy+3.5); doc.setFont('helvetica','normal'); doc.text(String(order.clientName || '-'), x+pad+15, cy+3.5, {maxWidth:w-18}); cy += 5;
      doc.setFont('helvetica','bold'); doc.text('Pedido:', x+pad, cy+3.5); doc.setFont('helvetica','normal'); doc.text(String(order.orderNumber || '-'), x+pad+15, cy+3.5); doc.setFont('helvetica','bold'); doc.text('Fecha:', x+pad+47, cy+3.5); doc.setFont('helvetica','normal'); doc.text(String(order.date || '-'), x+pad+60, cy+3.5); cy += 5;
      if(order.rut){ doc.setFont('helvetica','bold'); doc.text('RUT:', x+pad, cy+3.5); doc.setFont('helvetica','normal'); doc.text(String(order.rut), x+pad+11, cy+3.5); cy += 5; }
      doc.setFont('helvetica','bold'); doc.text('Pedido preparado por:', x+pad, cy+3.5); doc.setFont('helvetica','normal'); doc.text(String(order.preparedBy || '________________'), x+pad+40, cy+3.5, {maxWidth:w-43}); cy += 5;
      doc.setFont('helvetica','bold'); doc.text('Pedido facturado por:', x+pad, cy+3.5); doc.setFont('helvetica','normal'); doc.text(String(order.billedBy || '________________'), x+pad+40, cy+3.5, {maxWidth:w-43}); cy += 5;
      if(total > 1){ doc.setFont('helvetica','bold'); doc.text(`Continuación ${page}/${total}`, x+pad, cy+3.5); cy += 5; }
      cy += 2; doc.setFont('helvetica','bold'); doc.text('Cantidad', x+pad, cy+3.5); doc.text('Descripción', x+pad+qtyW, cy+3.5); doc.setDrawColor(153,153,153); doc.setLineWidth(.15); doc.line(x+pad, cy+5, x+w-pad, cy+5); cy += 8;
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      products.forEach(p => {
        const lines = doc.splitTextToSize(String(p.desc || ''), descW);
        const rowH = Math.max(6, 3.9 * lines.length + 2.4);
        doc.text(String(p.qty || ''), x+pad, cy+3.7, {maxWidth:qtyW-1});
        doc.text(lines, x+pad+qtyW, cy+3.7);
        doc.setDrawColor(222,222,222); doc.setLineWidth(.1); doc.line(x+pad, cy+rowH, x+w-pad, cy+rowH);
        cy += rowH;
      });
    }

    renderAll();
  </script>
</body>
